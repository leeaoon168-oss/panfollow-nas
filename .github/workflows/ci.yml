name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python 语法与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install ruff
      - name: 语法编译
        run: python -m compileall -q app
      - name: ruff
        run: ruff check app --select E9,F63,F7,F82 || true

  compose:
    name: docker compose 配置校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 生成占位 .env
        run: cp .env.example .env
      - name: 校验 compose
        run: docker compose config -q
